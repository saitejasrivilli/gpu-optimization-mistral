<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete System Architecture Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css" rel="stylesheet" type="text/css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f4b 50%, #0f1535 100%);
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: linear-gradient(90deg, rgba(10, 14, 39, 0.95) 0%, rgba(26, 31, 75, 0.95) 100%);
            padding: 20px 30px;
            border-bottom: 3px solid #00ff88;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .header h1 {
            color: #00ff88;
            font-size: 28px;
            margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .header p {
            color: #00d4ff;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .legend {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .content {
            display: flex;
            flex: 1;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
        }

        .canvas-container {
            flex: 1;
            background: linear-gradient(135deg, rgba(10, 14, 39, 0.6) 0%, rgba(26, 31, 75, 0.6) 100%);
            border-radius: 12px;
            border: 2px solid #00ff88;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 32px rgba(0, 255, 136, 0.15);
        }

        #network {
            width: 100%;
            height: 100%;
        }

        .sidebar {
            width: 380px;
            background: linear-gradient(135deg, rgba(26, 31, 75, 0.8) 0%, rgba(15, 21, 53, 0.8) 100%);
            border: 2px solid #00d4ff;
            border-radius: 12px;
            overflow-y: auto;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.15);
        }

        .sidebar h3 {
            color: #00ff88;
            margin-bottom: 20px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .node-title {
            color: #00ff88;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #00d4ff;
        }

        .info-block {
            background: rgba(0, 212, 255, 0.1);
            border-left: 4px solid #00d4ff;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.6;
        }

        .info-block.input {
            border-left-color: #00b8ff;
            background: rgba(0, 184, 255, 0.1);
        }

        .info-block.processing {
            border-left-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .info-block.storage {
            border-left-color: #ff9f43;
            background: rgba(255, 159, 67, 0.1);
        }

        .info-block.serving {
            border-left-color: #ee5a6f;
            background: rgba(238, 90, 111, 0.1);
        }

        .info-block.monitoring {
            border-left-color: #ffd700;
            background: rgba(255, 215, 0, 0.1);
        }

        .info-label {
            color: #00ff88;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }

        .info-value {
            color: #e0e0e0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(0, 212, 255, 0.2);
        }

        .metric-label {
            color: #00d4ff;
            font-size: 11px;
        }

        .metric-value {
            color: #00ff88;
            font-weight: bold;
            font-family: 'Courier New', monospace;
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        .status-indicator.active {
            background: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .status-indicator.ready {
            background: #00d4ff;
            box-shadow: 0 0 10px #00d4ff;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .data-flow-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #00d4ff;
        }

        .data-item {
            background: rgba(0, 255, 136, 0.05);
            padding: 8px;
            margin: 6px 0;
            border-radius: 4px;
            font-size: 11px;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            border-left: 2px solid #00ff88;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 212, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ff88 0%, #00d4ff 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(180deg, #00ff88 0%, #00d4ff 100%);
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .empty-state {
            color: #888;
            text-align: center;
            padding: 40px 20px;
            font-size: 13px;
        }

        .empty-state strong {
            color: #00d4ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏗️ Complete System Architecture</h1>
            <p>Clinical ML Pipeline on Google Cloud Platform - Click nodes for details</p>
            <div class="legend">
                <div class="legend-item">
                    <div class="legend-color" style="background: #00b8ff;"></div>
                    <span>Input Sources</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #00ff88;"></div>
                    <span>Processing</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ff9f43;"></div>
                    <span>Storage</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ee5a6f;"></div>
                    <span>Serving</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: #ffd700;"></div>
                    <span>Monitoring</span>
                </div>
            </div>
        </div>

        <div class="content">
            <div class="canvas-container">
                <div id="network"></div>
            </div>
            <div class="sidebar">
                <h3>Details</h3>
                <div id="sidebarContent">
                    <div class="empty-state">
                        <strong>Select a node</strong><br>to view details
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const architecture = {
            nodes: [

                { id: 'input-clinical', label: 'Clinical Notes\n(FHIR Format)', color: '#00b8ff', title: 'Clinical notes with patient data' },

                { id: 'ml-validate', label: 'Model Validation\n(Metrics)', color: '#00ff88', title: 'Evaluate model performance' },

                // PROCESSING - CLINICAL NLP
                { id: 'nlp-deid', label: 'De-Identification\n(PHI Masking)', color: '#00ff88', title: 'Remove sensitive data' },
                { id: 'nlp-ner', label: 'NER Extraction\n(Entities)', color: '#00ff88', title: 'Extract medical entities' },

        let network = null;

        function initNetwork() {
            const nodes = new vis.DataSet(architecture.nodes.map(n => ({
                id: n.id,
                label: n.label,
                color: {
                    background: n.color,
                    border: '#ffffff',
                    highlight: { background: '#ffffff', border: n.color }
                },
                font: {
                    color: '#ffffff',
                    size: 12,
                    face: 'Segoe UI',
                    bold: { color: '#ffffff' }
                },
                margin: { top: 15, bottom: 15, left: 15, right: 15 },
                borderWidth: 2,
                borderWidthSelected: 4,
                shadow: { enabled: true, color: 'rgba(0,0,0,0.5)', size: 15, x: 0, y: 0 },
                shape: 'box',
                smooth: { type: 'cubicBezier' }
            })));

            const edges = new vis.DataSet(architecture.edges.map(e => ({
                from: e.from,
                to: e.to,
                label: e.label,
                color: { color: e.color, opacity: 0.8, highlight: '#ffffff' },
                font: { color: e.color, size: 10 },
                arrows: { to: { enabled: true, scaleFactor: 0.5, type: 'arrow' } },
                smooth: { type: 'cubicBezier', forceDirection: false },
                width: e.width || 1,
                dashes: e.dashes || false
            })));

            const container = document.getElementById('network');
            const data = { nodes: nodes, edges: edges };
            const options = {
                physics: {
                    enabled: true,
                    stabilization: { iterations: 500 },
                    barnesHut: {
                        gravitationalConstant: -30000,
                        centralGravity: 0.3,
                        springLength: 250,
                        springConstant: 0.04
                    }
                },
                interaction: { hover: true, navigationButtons: true, keyboard: true },
                manipulation: false
            };

            if (network) network.destroy();
            network = new vis.Network(container, data, options);

            network.on('click', (params) => {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    showNodeInfo(nodeId);
                }
            });

            network.on('hoverNode', () => {
                document.getElementById('network').style.cursor = 'pointer';
            });

            network.on('blurNode', () => {
                document.getElementById('network').style.cursor = 'default';
            });
        }

        function showNodeInfo(nodeId) {
            const info = architecture.nodeInfo[nodeId];
            const container = document.getElementById('sidebarContent');

            if (info) {
                container.innerHTML = `
                    <div class="node-title">
                        <span class="status-indicator ${info.type === 'input' ? 'ready' : 'active'}"></span>
                        ${info.title}
                    </div>
                    ${info.content}
                `;
            }
        }

        window.addEventListener('load', initNetwork);
    </script>
